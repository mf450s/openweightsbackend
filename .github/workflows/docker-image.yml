name: Build and Publish Docker Image

on:
  push:
    branches: ['**']
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: mf450s/openweightsbackend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner == 'mf450s' && github.actor || secrets.GHCR_USERNAME }}
          password: ${{ github.repository_owner == 'mf450s' && secrets.GITHUB_TOKEN || secrets.GHCR_TOKEN }}
        # Forgejo mirrors the github context; repository_owner distinguishes the GitHub canonical.
        if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'mf450s' }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=nightly,enable=${{ github.ref_name == 'development' }}
            type=ref,event=branch,enable=${{ github.ref_name != 'main' && github.ref_name != 'development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
            type=raw,value=pr-check,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.repository_owner == 'mf450s' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
