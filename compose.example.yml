services:
  openweightsbackend:
    image: ${OW_IMAGE:-ghcr.io/mf450s/openweightsbackend}:${OW_TAG:-latest}
    container_name: ${OW_CONTAINER_NAME:-openweightsbackend}
    restart: ${OW_RESTART_POLICY:-unless-stopped}
    env_file:
      - .env
    ports:
      - "${OW_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-openweightsbackend}
      APP_ENV: ${APP_ENV:-production}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-10080}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-openweights}}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-openweights-postgres}
    restart: ${OW_RESTART_POLICY:-unless-stopped}
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openweights}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ${POSTGRES_VOLUME_NAME:-openweights_db_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-openweights}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openweights_db_data:
    name: ${POSTGRES_VOLUME_NAME:-openweights_db_data}
